<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LemonHub - Premium Key System</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#03050a;
    --card:rgba(10,15,22,.82);
    --green:#caff3d;
    --green2:#61ff91;
    --white:#fff;
    --muted:#8993a3;
}

html,body{
    width:100%;
    min-height:100%;
    font-family:Arial,sans-serif;
    color:var(--white);
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:#03050a;
}

/* BACKGROUND GLOW */

body:before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
        radial-gradient(circle at 20% 20%,rgba(202,255,61,.15),transparent 27%),
        radial-gradient(circle at 80% 80%,rgba(97,255,145,.12),transparent 30%),
        radial-gradient(circle at 50% 100%,rgba(202,255,61,.07),transparent 35%);
    animation:bgPulse 8s ease-in-out infinite alternate;
}

@keyframes bgPulse{
    0%{
        opacity:.55;
        transform:scale(1);
    }

    100%{
        opacity:1;
        transform:scale(1.08);
    }
}

/* MOVING GRID */

.grid{
    position:fixed;
    inset:-50%;
    pointer-events:none;
    opacity:.18;

    background-image:
        linear-gradient(rgba(202,255,61,.07) 1px,transparent 1px),
        linear-gradient(90deg,rgba(202,255,61,.07) 1px,transparent 1px);

    background-size:55px 55px;

    transform:
        perspective(500px)
        rotateX(65deg)
        translateY(120px);

    animation:gridMove 8s linear infinite;
}

@keyframes gridMove{
    to{
        background-position:0 55px,55px 0;
    }
}

/* AURORA */

.aurora{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    filter:blur(45px);
    opacity:.4;
}

.wave{
    position:absolute;
    width:60vw;
    height:25vh;
    border-radius:50%;
    background:rgba(202,255,61,.1);
    animation:wave 10s ease-in-out infinite;
}

.wave:nth-child(1){
    left:-15%;
    top:15%;
    transform:rotate(-15deg);
}

.wave:nth-child(2){
    right:-15%;
    top:55%;
    background:rgba(97,255,145,.08);
    animation-delay:2s;
}

.wave:nth-child(3){
    left:20%;
    bottom:-10%;
    animation-delay:4s;
}

@keyframes wave{

    0%,100%{
        transform:translate(0,0) rotate(-15deg) scale(1);
    }

    50%{
        transform:translate(80px,-40px) rotate(10deg) scale(1.25);
    }
}

/* FLOATING ORBS */

.orb{
    position:fixed;
    border-radius:50%;
    pointer-events:none;
    filter:blur(3px);
    box-shadow:0 0 60px currentColor;
    opacity:.5;
}

.orb.one{
    width:9px;
    height:9px;
    background:var(--green);
    color:var(--green);
    left:15%;
    top:22%;
    animation:orb1 9s ease-in-out infinite;
}

.orb.two{
    width:6px;
    height:6px;
    background:var(--green2);
    color:var(--green2);
    right:20%;
    top:18%;
    animation:orb2 7s ease-in-out infinite;
}

.orb.three{
    width:8px;
    height:8px;
    background:var(--green);
    color:var(--green);
    left:75%;
    bottom:18%;
    animation:orb3 11s ease-in-out infinite;
}

@keyframes orb1{
    50%{
        transform:translate(100px,150px) scale(2);
    }
}

@keyframes orb2{
    50%{
        transform:translate(-120px,100px) scale(.5);
    }
}

@keyframes orb3{
    50%{
        transform:translate(-160px,-130px) scale(1.8);
    }
}

/* PARTICLES */

.particles{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
}

.particle{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:var(--green);
    box-shadow:0 0 8px var(--green);
    opacity:0;

    animation:particleRise linear infinite;
}

@keyframes particleRise{

    0%{
        transform:translate3d(0,110vh,0) scale(.3);
        opacity:0;
    }

    15%{
        opacity:.8;
    }

    75%{
        opacity:.5;
    }

    100%{
        transform:
            translate3d(var(--drift),-10vh,0)
            scale(1.5);
        opacity:0;
    }
}

/* MAIN */

.container{
    position:relative;
    z-index:10;
    width:min(455px,92%);
}

.card{
    position:relative;
    padding:34px;
    border-radius:32px;

    background:
        linear-gradient(
            145deg,
            rgba(15,21,29,.88),
            rgba(5,9,14,.8)
        );

    border:1px solid rgba(202,255,61,.13);

    backdrop-filter:blur(28px);
    -webkit-backdrop-filter:blur(28px);

    box-shadow:
        0 35px 100px rgba(0,0,0,.65),
        0 0 80px rgba(202,255,61,.08);

    animation:
        cardIn .9s cubic-bezier(.2,.8,.2,1),
        cardFloat 6s ease-in-out 1s infinite;
}

/* KHÔNG XOAY CARD NỮA */
/* Chỉ glow nhẹ */

.card:before{
    content:"";
    position:absolute;
    inset:-1px;
    border-radius:32px;
    padding:1px;

    background:
        linear-gradient(
            120deg,
            transparent 15%,
            rgba(202,255,61,.4),
            transparent 35%,
            rgba(97,255,145,.25),
            transparent 60%
        );

    -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);

    -webkit-mask-composite:xor;
    mask-composite:exclude;

    animation:borderGlow 4s ease-in-out infinite;

    pointer-events:none;
}

.card:after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:32px;
    pointer-events:none;

    background:
        linear-gradient(
            115deg,
            transparent 15%,
            rgba(255,255,255,.07) 45%,
            transparent 60%
        );

    transform:translateX(-120%);

    animation:cardShine 6s ease-in-out infinite;
}

@keyframes cardIn{

    from{
        opacity:0;
        transform:translateY(60px) scale(.9);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

@keyframes cardFloat{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-6px);
    }
}

@keyframes borderGlow{

    0%,100%{
        opacity:.3;
        filter:brightness(.8);
    }

    50%{
        opacity:1;
        filter:brightness(1.4);
    }
}

@keyframes cardShine{

    0%,55%{
        transform:translateX(-120%);
    }

    75%,100%{
        transform:translateX(120%);
    }
}

/* LEMON LOGO */

.logo{
    position:relative;

    width:92px;
    height:92px;

    margin:0 auto 20px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:29px;

    background:
        radial-gradient(
            circle,
            rgba(202,255,61,.2),
            rgba(202,255,61,.02) 68%
        );

    border:1px solid rgba(202,255,61,.35);

    box-shadow:
        0 0 30px rgba(202,255,61,.22),
        inset 0 0 30px rgba(202,255,61,.08);

    animation:logoFloat 3.2s ease-in-out infinite;
}

.logo:before{
    content:"";

    position:absolute;

    width:72px;
    height:72px;

    border-radius:50%;

    border:1px dashed rgba(202,255,61,.25);

    animation:ring 10s linear infinite;
}

.logo:after{
    content:"";

    position:absolute;

    width:105px;
    height:105px;

    border-radius:50%;

    border:1px solid rgba(202,255,61,.06);
}

@keyframes logoFloat{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-8px);
    }
}

@keyframes ring{

    to{
        transform:rotate(360deg);
    }
}

/* LEMON */

.lemon{
    position:relative;

    width:55px;
    height:55px;

    transform:rotate(-25deg);

    z-index:2;

    filter:
        drop-shadow(0 0 9px #dfff35)
        drop-shadow(0 0 24px rgba(202,255,61,.45));
}

.lemon-body{
    position:absolute;

    width:41px;
    height:47px;

    left:7px;
    top:7px;

    border-radius:48% 52% 48% 52%;

    background:
        radial-gradient(
            circle at 27% 22%,
            #fffcc8 0 4%,
            transparent 5%
        ),
        linear-gradient(
            135deg,
            #fff94d,
            #eaff00 45%,
            #b7df00
        );

    box-shadow:
        inset -7px -8px 12px rgba(110,130,0,.3),
        inset 6px 5px 11px rgba(255,255,255,.38);

    animation:lemonPulse 2.5s ease-in-out infinite;
}

.lemon-body:before{
    content:"";

    position:absolute;
    inset:7px;

    border-radius:inherit;

    background:
        radial-gradient(
            circle at 25% 30%,
            rgba(90,110,0,.25) 0 1px,
            transparent 2px
        ),
        radial-gradient(
            circle at 65% 60%,
            rgba(90,110,0,.2) 0 1px,
            transparent 2px
        ),
        radial-gradient(
            circle at 40% 80%,
            rgba(90,110,0,.18) 0 1px,
            transparent 2px
        );
}

.lemon-body:after{
    content:"";

    position:absolute;

    width:7px;
    height:7px;

    left:16px;
    top:-5px;

    border-radius:50%;

    background:#b8d900;
}

.leaf{
    position:absolute;

    width:25px;
    height:14px;

    top:0;
    right:-4px;

    background:
        linear-gradient(
            135deg,
            #d6ff61,
            #39ad47
        );

    border-radius:100% 0 100% 0;

    transform:rotate(25deg);

    box-shadow:
        0 0 10px rgba(100,255,80,.55);

    z-index:3;
}

.leaf:after{
    content:"";

    position:absolute;

    width:18px;
    height:1px;

    left:2px;
    top:7px;

    background:rgba(255,255,255,.5);

    transform:rotate(-20deg);
}

.shine{
    position:absolute;

    width:10px;
    height:19px;

    left:13px;
    top:13px;

    border-radius:50%;

    background:rgba(255,255,255,.32);

    filter:blur(2px);

    transform:rotate(20deg);

    z-index:4;
}

@keyframes lemonPulse{

    50%{
        transform:scale(1.07);
    }
}

/* TITLE */

h1{
    text-align:center;
    font-size:32px;
    letter-spacing:-1px;

    animation:textIn .8s ease .2s both;
}

h1 span{
    color:var(--green);

    text-shadow:
        0 0 22px rgba(202,255,61,.35);
}

.subtitle{
    text-align:center;

    color:var(--muted);

    margin-top:8px;

    font-size:14px;

    animation:textIn .8s ease .35s both;
}

@keyframes textIn{

    from{
        opacity:0;
        transform:translateY(12px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* STATUS */

.status{
    display:flex;

    justify-content:center;
    align-items:center;

    gap:9px;

    margin:24px 0;

    color:#b8c0cd;

    font-size:13px;

    animation:textIn .8s ease .5s both;
}

.dot{
    width:8px;
    height:8px;

    border-radius:50%;

    background:var(--green);

    box-shadow:
        0 0 10px var(--green);

    animation:blink 1.2s ease-in-out infinite;
}

@keyframes blink{

    0%,100%{
        opacity:1;
        transform:scale(1);
    }

    50%{
        opacity:.3;
        transform:scale(.65);
    }
}

/* KEY BOX */

.key-box{
    position:relative;

    padding:20px;

    border-radius:19px;

    background:rgba(255,255,255,.045);

    border:1px solid rgba(255,255,255,.09);

    overflow:hidden;

    animation:boxIn .8s ease .6s both;
}

.key-box:before{
    content:"";

    position:absolute;

    left:-35%;
    top:0;

    width:30%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(202,255,61,.1),
            transparent
        );

    transform:skewX(-12deg);

    animation:keyShine 4.5s ease-in-out infinite;
}

.key-box:after{
    content:"";

    position:absolute;

    inset:0;

    border-radius:19px;

    box-shadow:
        inset 0 0 25px rgba(202,255,61,.025);

    pointer-events:none;
}

@keyframes boxIn{

    from{
        opacity:0;
        transform:scale(.94) translateY(15px);
    }

    to{
        opacity:1;
        transform:scale(1) translateY(0);
    }
}

@keyframes keyShine{

    0%,55%{
        left:-35%;
        opacity:0;
    }

    65%{
        opacity:1;
    }

    85%,100%{
        left:125%;
        opacity:0;
    }
}

.key-label{
    position:relative;

    color:var(--muted);

    font-size:10px;

    text-transform:uppercase;

    letter-spacing:1.7px;

    margin-bottom:10px;
}

.key{
    position:relative;

    font-size:15px;

    font-weight:700;

    letter-spacing:.4px;

    word-break:break-all;

    text-shadow:
        0 0 12px rgba(255,255,255,.12);
}

/* BUTTON */

button{
    position:relative;

    width:100%;

    border:0;

    margin-top:14px;

    padding:17px;

    border-radius:17px;

    background:
        linear-gradient(
            110deg,
            var(--green),
            #e9ff66,
            var(--green2),
            var(--green)
        );

    background-size:250% 100%;

    color:#071006;

    font-size:15px;

    font-weight:900;

    cursor:pointer;

    transition:.25s;

    box-shadow:
        0 10px 30px rgba(202,255,61,.16);

    overflow:hidden;

    animation:
        buttonIn .8s ease .75s both,
        buttonGradient 4s linear infinite;
}

button:before{
    content:"";

    position:absolute;

    top:-70%;
    left:-30%;

    width:30%;
    height:240%;

    background:rgba(255,255,255,.55);

    filter:blur(10px);

    transform:rotate(20deg);

    animation:buttonShine 3s ease-in-out infinite;
}

button:after{
    content:"";

    position:absolute;

    inset:0;

    border-radius:17px;

    box-shadow:
        inset 0 1px rgba(255,255,255,.55);
}

button:hover{
    transform:translateY(-4px) scale(1.015);

    box-shadow:
        0 18px 40px rgba(202,255,61,.28),
        0 0 25px rgba(202,255,61,.13);
}

button:active{
    transform:scale(.97);
}

@keyframes buttonIn{

    from{
        opacity:0;
        transform:translateY(15px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes buttonGradient{

    to{
        background-position:250% 0;
    }
}

@keyframes buttonShine{

    0%,55%{
        left:-35%;
    }

    75%,100%{
        left:125%;
    }
}

/* FOOTER */

.footer{
    text-align:center;

    margin-top:25px;

    color:#5f6877;

    font-size:11px;

    line-height:1.8;

    animation:textIn 1s ease .9s both;
}

.footer span{
    color:var(--green);

    text-shadow:
        0 0 10px rgba(202,255,61,.2);
}

/* TOAST */

.toast{
    position:fixed;

    left:50%;
    bottom:28px;

    z-index:30;

    transform:
        translate(-50%,30px)
        scale(.9);

    padding:13px 20px;

    border-radius:13px;

    background:rgba(12,18,25,.92);

    border:1px solid rgba(202,255,61,.28);

    color:#fff;

    opacity:0;

    pointer-events:none;

    transition:.35s cubic-bezier(.2,.8,.2,1);

    font-size:13px;

    box-shadow:
        0 15px 40px rgba(0,0,0,.45),
        0 0 25px rgba(202,255,61,.08);
}

.toast.show{
    opacity:1;

    transform:
        translate(-50%,0)
        scale(1);
}

/* MOBILE */

@media(max-width:500px){

    .card{
        padding:28px 21px;
        border-radius:27px;
    }

    h1{
        font-size:28px;
    }

    .logo{
        width:82px;
        height:82px;
    }

    .key{
        font-size:14px;
    }
}
</style>
</head>

<body>

<div class="grid"></div>

<div class="aurora">
    <div class="wave"></div>
    <div class="wave"></div>
    <div class="wave"></div>
</div>

<div class="orb one"></div>
<div class="orb two"></div>
<div class="orb three"></div>

<div class="particles" id="particles"></div>


<div class="container">

    <div class="card">

        <!-- LEMON -->

        <div class="logo">

            <div class="lemon">

                <div class="leaf"></div>

                <div class="lemon-body"></div>

                <div class="shine"></div>

            </div>

        </div>


        <!-- TITLE -->

        <h1>
            <span>Lemon</span>Hub
        </h1>

        <div class="subtitle">
            Premium Key Access System
        </div>


        <!-- STATUS -->

        <div class="status">

            <div class="dot"></div>

            Key System Online

        </div>


        <!-- KEY -->

        <div class="key-box">

            <div class="key-label">
                Your Current Key
            </div>

            <div
                class="key"
                id="key"
            >
                LemonHub-Premium-StealAnEgg
            </div>

        </div>


        <!-- BUTTON -->

        <button id="copyBtn">
            Copy Key
        </button>


        <!-- FOOTER -->

        <div class="footer">

            LemonHub Premium Key System

            <br>

            <span>
                Secure • Fast • Reliable
            </span>

        </div>

    </div>

</div>


<!-- TOAST -->

<div
    class="toast"
    id="toast"
>
    ✓ Key copied successfully!
</div>


<script>

const LEMONHUB_KEY =
    "LemonHub-Premium-StealAnEgg";


document.getElementById("key").textContent =
    LEMONHUB_KEY;


/* COPY KEY */

document
.getElementById("copyBtn")
.addEventListener("click", async () => {

    try{

        await navigator.clipboard.writeText(
            LEMONHUB_KEY
        );

        showToast(
            "✓ Key copied successfully!"
        );

    }

    catch(e){

        const textarea =
            document.createElement("textarea");

        textarea.value =
            LEMONHUB_KEY;

        document.body.appendChild(
            textarea
        );

        textarea.select();

        document.execCommand("copy");

        textarea.remove();

        showToast(
            "✓ Key copied successfully!"
        );

    }

});


/* TOAST */

function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.textContent =
        message;

    toast.classList.add("show");

    setTimeout(() => {

        toast.classList.remove("show");

    },2200);

}


/* PARTICLES */

const particles =
    document.getElementById("particles");


for(let i=0;i<65;i++){

    const p =
        document.createElement("div");

    p.className =
        "particle";

    p.style.left =
        Math.random()*100 + "%";

    p.style.animationDuration =
        (5 + Math.random()*12) + "s";

    p.style.animationDelay =
        (-Math.random()*15) + "s";

    p.style.setProperty(
        "--drift",
        (Math.random()*180-90) + "px"
    );

    const size =
        Math.random()*2.5+1;

    p.style.width =
        size + "px";

    p.style.height =
        size + "px";

    particles.appendChild(p);
}

</script>

</body>
</html>
